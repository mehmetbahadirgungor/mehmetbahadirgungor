<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Bahadır Güngör — software developer</title>
  <desc id="desc">Minimal dark teal banner about mobile development, AI-powered products, and software systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1721"/>
      <stop offset="100%" stop-color="#15353A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43DFC0"/>
      <stop offset="100%" stop-color="#8FF5E4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5C9C9A" stroke-width=".6" opacity=".15"/>
