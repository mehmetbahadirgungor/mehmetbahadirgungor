    <rect x="-53" y="-53" width="106" height="106" rx="19" transform="rotate(13)"/>
    <path d="M-38 -4L-15 -27M-38 -4L-15 19M38 -4L15 -27M38 -4L15 19"/>
    <circle cx="0" cy="-93" r="5" fill="#52DCC5" stroke="none"/>
